host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: A database-agnostic Dynamic Model and Diff-Based Schema Migration Engine
    supporting PostgreSQL, MongoDB, MySQL, and Memory adapters.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Dynamic Model & Schema Migration Engine API
  version: "1.0"
paths:
  /api/data/{model}:
    get:
      description: Find records with dynamic filters, sorting, and pagination
      parameters:
      - description: Model Name or ID
        in: path
        name: model
        required: true
        type: string
      - description: Page limit
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      - description: Sort fields (e.g. name,-age)
        in: query
        name: sort
        type: string
      - description: Orbital relations, comma-separated (e.g. Customer,OrderProducts)
        in: query
        name: relations
        type: string
      - description: Enable verbose runtime query logging
        in: query
        name: debug
        type: boolean
      - description: Include filter and bound values in debug logs (values are redacted
          by default)
        in: query
        name: debug_include_args
        type: boolean
      - description: Log a slow-query event when runtime reaches this duration
        in: query
        name: slow_query_threshold_ms
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Query records
      tags:
      - Data
    post:
      consumes:
      - application/json
      description: Insert a new record validated and coerced against active Model
        definition
      parameters:
      - description: Model Name or ID
        in: path
        name: model
        required: true
        type: string
      - description: Record Data
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Create dynamic record
      tags:
      - Data
  /api/data/{model}/{id}:
    delete:
      description: Remove a record by its primary key identifier
      parameters:
      - description: Model Name or ID
        in: path
        name: model
        required: true
        type: string
      - description: Record ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete record
      tags:
      - Data
    get:
      description: Find an individual record by its primary key identifier
      parameters:
      - description: Model Name or ID
        in: path
        name: model
        required: true
        type: string
      - description: Record ID
        in: path
        name: id
        required: true
        type: string
      - description: Orbital relations, comma-separated (e.g. Customer,OrderProducts)
        in: query
        name: relations
        type: string
      - description: Enable verbose runtime query logging
        in: query
        name: debug
        type: boolean
      - description: Include filter and bound values in debug logs (values are redacted
          by default)
        in: query
        name: debug_include_args
        type: boolean
      - description: Log a slow-query event when runtime reaches this duration
        in: query
        name: slow_query_threshold_ms
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get record by ID
      tags:
      - Data
    patch:
      consumes:
      - application/json
      description: Update specific fields of an existing record by ID
      parameters:
      - description: Model Name or ID
        in: path
        name: model
        required: true
        type: string
      - description: Record ID
        in: path
        name: id
        required: true
        type: string
      - description: Partial Data
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Partial update record
      tags:
      - Data
    put:
      consumes:
      - application/json
      description: Completely replace an existing record by its primary key identifier
      parameters:
      - description: Model Name or ID
        in: path
        name: model
        required: true
        type: string
      - description: Record ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated Record Data
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Full update record
      tags:
      - Data
  /api/data/{model}/filter:
    post:
      consumes:
      - application/json
      description: Filter and query records via structured JSON payload (compatible
        with AG-Grid and PaginationRequest filter criteria)
      parameters:
      - description: Model Name or ID
        in: path
        name: model
        required: true
        type: string
      - description: Pagination and Filter Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/query.PaginationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Post Filter Query
      tags:
      - Data
  /api/models:
    get:
      description: Get a list of all registered models (active and drafts)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List all models
      tags:
      - Models
    post:
      consumes:
      - application/json
      description: Register a new dynamic model metadata definition in DRAFT status
      parameters:
      - description: Model Definition
        in: body
        name: model
        required: true
        schema:
          $ref: '#/definitions/model.Model'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Model'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Create a model draft
      tags:
      - Models
  /api/models/{model}:
    delete:
      description: Delete a model metadata definition from active and draft registries
      parameters:
      - description: Model ID
        in: path
        name: model
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete model
      tags:
      - Models
    get:
